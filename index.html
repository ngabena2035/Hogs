<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOGS ($HG) — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111318;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #1b1f2a;
      border-radius: 16px;
      padding: 20px;
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }
    .task {
      background: #252b3b;
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
      text-align: left;
    }
    button {
      background: #f59e0b;
      color: #111318;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="1795313325197.jpg" alt="Logo HOGS" />
    <h1>HOGS ($HG)</h1>
    <p>Hub communautaire, tâches et airdrop HOGS.</p>
    <p><strong>Points : <span id="points">0</span></strong></p>

    <div class="task">
      <div><strong>1. Rejoindre la communauté HOGS</strong> (+50 pts)</div>
      <button onclick="claimTask(this, 50)">Valider la tâche</button>
    </div>

    <div class="task">
      <div><strong>2. Partager le projet HOGS</strong> (+100 pts)</div>
      <button onclick="claimTask(this, 100)">Valider la tâche</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let points = 0;
    function claimTask(btn, pts) {
      points += pts;
      document.getElementById("points").textContent = points;
      btn.disabled = true;
      btn.textContent = "Validé";
    }
  </script>
</body>
</html>
